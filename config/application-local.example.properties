# Copy to config/application-local.properties (ignored by Git).
# This external file is loaded from the project working directory and is NOT bundled into the JAR.
# Replace the environment placeholders locally only if you do not use environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yiyuan?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Only the staff portal creates an administrator, and only if no administrator exists.
hospital.admin.username=${HOSPITAL_ADMIN_USERNAME:admin}
hospital.admin.password=${HOSPITAL_ADMIN_PASSWORD:}

# Optional paid external service. Disabled by default; local rules remain available.
ai.qwen.enabled=${AI_QWEN_ENABLED:false}
ai.qwen.api-key=${DASHSCOPE_API_KEY:}
