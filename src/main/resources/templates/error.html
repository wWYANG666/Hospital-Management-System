<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>错误 - 医院管理系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(760px, 100%);
            background: rgba(255,255,255,0.96);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.25);
            padding: 26px 24px;
        }
        h1 { font-size: 20px; color: #303133; margin-bottom: 10px; }
        .meta { color: #606266; font-size: 13px; margin-bottom: 14px; }
        .panel {
            background: #f8fafc;
            border: 1px solid #eef2f7;
            border-radius: 12px;
            padding: 12px 14px;
            color: #303133;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
        }
        .row { margin: 8px 0; }
        .label { color: #909399; margin-right: 8px; }
        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background: #ffffff;
            border: 1px solid #eef2f7;
            padding: 2px 6px;
            border-radius: 8px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }
        a.btn {
            text-decoration: none;
            display: inline-block;
            padding: 10px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 13px;
        }
        .primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 10px 26px rgba(102,126,234,0.45);
        }
        .ghost {
            border: 1px solid #e4e7ed;
            color: #303133;
            background: #fff;
        }
    </style>
    <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body class="app-theme role-error theme-medical">
<div class="card">
    <h1>发生错误</h1>
    <div class="meta">暂时无法完成请求。如问题持续存在，请记录下方时间与访问地址并联系管理员。</div>
    <div class="panel">
        <div class="row"><span class="label">状态码</span><span th:text="${status}">status</span> <span th:text="${error}">error</span></div>
        <div class="row"><span class="label">路径</span><code th:text="${path}">/path</code></div>
        <div class="row"><span class="label">时间</span><span th:text="${timestamp}">timestamp</span></div>
        <div class="row" th:if="${message != null and !#strings.isEmpty(message)}"><span class="label">消息</span><span th:text="${message}">message</span></div>
        <div class="row" th:if="${exception != null}"><span class="label">异常</span><code th:text="${exception}">exception</code></div>
    </div>
    <div class="actions">
        <a class="btn primary" href="/">返回首页</a>
        <a class="btn ghost" href="/login">去登录</a>
    </div>
</div>
</body>
</html>
