<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册结果 - 医院管理系统</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(0deg, rgba(245,247,251,0.78), rgba(245,247,251,0.78)),
                url("/images/hospital-outpatient.png") center/cover no-repeat;
            z-index: 0;
        }
        .card {
            background: #fff;
            width: 460px;
            max-width: 92%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            padding: 28px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        h1 { color: #2e7d32; margin-bottom: 8px; }
        p { color: #444; margin-bottom: 20px; }
        a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            background: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>注册成功</h1>
    <p th:text="${message}">注册成功，请登录。</p>
    <a href="/login">前往登录</a>
</div>
</body>
</html>
