<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医生注册 - 医院管理系统</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(0deg, rgba(245,247,251,0.86), rgba(245,247,251,0.86)),
                url("/images/hospital-outpatient.png") center/cover no-repeat;
            z-index: 0;
        }
        .container {
            max-width: 760px;
            margin: 28px auto;
            background: #fff;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 6px 20px rgba(0,0,0,.08);
            position: relative;
            z-index: 1;
        }
        h1 { margin-top: 0; color: #333; }
        .tips { font-size: 14px; color: #666; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .full { grid-column: 1 / span 2; }
        label { display: block; margin-bottom: 6px; color: #444; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #d6d9df; border-radius: 6px; box-sizing: border-box; }
        textarea { min-height: 96px; resize: vertical; }
        .msg { margin-bottom: 14px; padding: 10px; border-radius: 6px; }
        .msg.error { color: #842029; background: #f8d7da; }
        .actions { margin-top: 16px; display: flex; gap: 10px; }
        button, .link-btn { padding: 10px 14px; border: none; border-radius: 6px; text-decoration: none; cursor: pointer; font-weight: 600; }
        button { background: #667eea; color: #fff; }
        .link-btn { background: #e9edf7; color: #334; }
    </style>
</head>
<body>
<div class="container">
    <h1>医生注册</h1>
    <p class="tips">请填写真实执业信息</p>

    <div th:if="${error}" class="msg error" th:text="${message}"></div>

    <form th:action="@{/register/doctor}" method="post">
        <div class="grid">
            <div>
                <label for="username">用户名 *</label>
                <input id="username" name="username" required>
            </div>
            <div>
                <label for="password">密码 *</label>
                <input id="password" name="password" type="password" required>
            </div>
            <div>
                <label for="realName">真实姓名 *</label>
                <input id="realName" name="realName" required>
            </div>
            <div>
                <label for="phone">手机号</label>
                <input id="phone" name="phone">
            </div>
            <div>
                <label for="email">邮箱</label>
                <input id="email" name="email" type="email">
            </div>
            <div>
                <label for="department">科室 *</label>
                <select id="department" name="department" required>
                    <option value="">请选择科室</option>
                    <option th:each="dept : ${departments}" th:value="${dept.name}" th:text="${dept.name}"></option>
                </select>
            </div>
            <div>
                <label for="title">职称</label>
                <input id="title" name="title">
            </div>
            <div>
                <label for="specialty">专长</label>
                <input id="specialty" name="specialty">
            </div>
            <div class="full">
                <label for="introduction">个人简介</label>
                <textarea id="introduction" name="introduction"></textarea>
            </div>
        </div>

        <div class="actions">
            <button type="submit">提交注册申请</button>
            <a class="link-btn" href="/register">返回</a>
        </div>
    </form>
</div>
</body>
</html>
