<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住院申请</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
    <link rel="stylesheet" href="/css/patient-ui.css">
    <style>
        .patient-req-shell { max-width: 980px; margin: 16px auto 36px; padding: 0 16px; }
        .patient-req-shell .card-title { margin-bottom: 6px; }
        .patient-req-shell .card-sub { font-size: 13px; color: #909399; margin-bottom: 14px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 16px;
        }
        .form-grid .full { grid-column: 1 / -1; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #303133; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group .note { font-size: 12px; color: #909399; margin-top: 6px; }
        .helper-box {
            margin-top: 16px;
            padding: 12px 14px;
            background: #ecf5ff;
            border-radius: 8px;
            font-size: 13px;
            color: #606266;
            line-height: 1.5;
        }
        .btn-submit {
            margin-top: 16px;
            padding: 10px 22px;
            background: #409EFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-submit:hover { background: #66b1ff; }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="patient-ui theme-medical">
<div th:replace="~{patient/fragments :: topbarPatientSub('/patient/hospitalizations', '住院申请', '填写住院申请')}"></div>

<main class="page patient-req-shell">
        <div class="card">
            <div class="card-title">填写住院申请</div>
            <div class="card-sub">填写住院申请信息</div>
        </div>

        <div class="card">
            <div class="card-title">申请信息</div>
            <div class="card-sub">提交后可查看进度</div>

            <form th:action="@{/patient/hospitalizations/request}" method="post" th:object="${hospitalization}">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">入院日期</label>
                        <input type="date" name="admissionDate" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">主治医生（可选）</label>
                        <select name="doctorId">
                            <option value="">请选择主治医生</option>
                            <option th:each="doctor : ${doctors}"
                                    th:value="${doctor.id}"
                                    th:text="${doctorUserMap[doctor.id] != null ? doctorUserMap[doctor.id].realName + ' - ' + (doctor.department ?: '') + ' - ' + (doctor.title ?: '') : doctor.doctorCode}">
                            </option>
                        </select>
                        <div class="note">未选择时系统自动安排医生</div>
                    </div>
                    <div class="form-group full">
                        <label class="form-label">诊断或住院原因</label>
                        <textarea name="diagnosis" rows="5" placeholder="请简要描述当前主要诊断、症状或需要住院治疗的原因"></textarea>
                    </div>
                </div>

                <div class="helper-box">
                    提交后可查看进度。
                </div>

                <button type="submit" class="btn-submit">提交申请</button>
            </form>
        </div>
</main>
</body>
</html>
