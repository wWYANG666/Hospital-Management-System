<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付宝支付</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
    <link rel="stylesheet" href="/css/patient-ui.css">
    <style>
        .alipay-page .page { max-width: 800px; }
        .alipay-page .card {
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            padding: 20px 22px;
            border: 1px solid #EBEEF5;
        }
        .amount {
            font-size:32px;
            font-weight:700;
            color:#dc2626;
            margin:12px 0;
        }
        .info-row { font-size:14px; margin:4px 0; color:#606266; }
        .btn-row { margin-top:20px; display:flex; gap:12px; flex-wrap:wrap; }
        .btn {
            padding:10px 22px;
            border-radius:4px;
            border:none;
            cursor:pointer;
            font-size:14px;
        }
        .btn-primary { background:#409EFF; color:#fff; }
        .btn-primary:hover { background:#66b1ff; }
        .btn-secondary { background:#e2e8f0; color:#475569; }
        .hint {
            margin-top:12px;
            font-size:12px;
            color:#909399;
            line-height:1.6;
        }
    </style>
</head>
<body class="patient-ui alipay-page theme-medical">
<div th:replace="~{patient/fragments :: topbarPatientSub(${cancelUrl != null ? cancelUrl : '/patient/dashboard'}, '支付宝支付', '确认支付信息')}"></div>

<main class="page">
    <div class="card">
        <div class="info-row">
            支付项目：
            <span th:text="${paymentType == 'PRESCRIPTION' ? '处方购药费用' : (paymentType == 'EXAM_REPORT' ? '检查/检验费用' : '住院费用')}"></span>
        </div>
        <div class="info-row">
            订单号：<span th:text="${orderNumber}"></span>
        </div>
        <div class="info-row">
            患者信息：<span th:text="${patientName}"></span>
        </div>
        <div class="amount">
            ¥ <span th:text="${amount}"></span>
        </div>

        <!-- 处方支付详情 -->
        <div th:if="${paymentType == 'PRESCRIPTION'}" class="u-mt16-secondary">
            <div class="u-title-mini">处方明细</div>
            <div th:if="${prescriptionItems != null and !prescriptionItems.isEmpty()}">
                <table class="u-table-xs">
                    <thead>
                    <tr class="u-bg-soft-gray">
                        <th class="u-py6-px4-left">药品名称</th>
                        <th class="u-py6-px4-left">规格</th>
                        <th class="u-py6-px4-left">数量</th>
                        <th class="u-py6-px4-left">单价</th>
                        <th class="u-py6-px4-left">小计</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${prescriptionItems}">
                        <td class="u-py6-px4" th:text="${item.medicineName}"></td>
                        <td class="u-py6-px4" th:text="${item.specification}"></td>
                        <td class="u-py6-px4">
                            <span th:text="${item.quantity != null ? item.quantity : '-'}">-</span>
                            <span th:if="${item.unit != null and !#strings.isEmpty(item.unit)}"
                                  th:text="${' ' + item.unit}"></span>
                        </td>
                        <td class="u-py6-px4">¥<span th:text="${item.price}"></span></td>
                        <td class="u-py6-px4">¥<span th:text="${item.totalPrice}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${prescriptionItems == null or prescriptionItems.isEmpty()}">
                暂无处方明细
            </div>
        </div>

        <!-- 检查/检验费用 -->
        <div th:if="${paymentType == 'EXAM_REPORT'}" class="u-mt16-secondary">
            <div class="u-title-mini">检查项目</div>
            <div th:text="${examReportName != null ? examReportName : '检查/检验'}"></div>
            <div class="u-mt8-xs-muted">支付后医生可填写报告。</div>
        </div>

        <!-- 住院费用详情 -->
        <div th:if="${paymentType == 'HOSPITALIZATION'}" class="u-mt16-secondary">
            <div class="u-title-mini">住院信息</div>
            <div th:if="${hospitalization != null}">
                <div>入院日期：<span th:text="${hospitalization.admissionDate}"></span></div>
                <div th:if="${hospitalization.dischargeDate != null}">出院日期：<span th:text="${hospitalization.dischargeDate}"></span></div>
                <div>诊断：<span th:text="${hospitalization.diagnosis}"></span></div>
                <div>总费用：¥<span th:text="${hospitalization.totalCost}"></span></div>
            </div>

            <!-- 简要展示住院期间的用药和检查医嘱 -->
            <div th:if="${medicalOrders != null and !medicalOrders.isEmpty()}" class="u-mt-10">
                <div class="u-title-mini-4">住院期间医嘱概览</div>
                <ul class="u-list-plain">
                    <li th:each="order : ${medicalOrders}">
                        <span th:text="${order.orderType == T(xmu.edu.yiyuan.entity.MedicalOrder.OrderType).MEDICATION ? '用药医嘱' :
                                       (order.orderType == T(xmu.edu.yiyuan.entity.MedicalOrder.OrderType).EXAMINATION ? '检查医嘱' :
                                       (order.orderType == T(xmu.edu.yiyuan.entity.MedicalOrder.OrderType).NURSING ? '护理医嘱' : '其他医嘱'))}"></span>
                        ：
                        <span th:text="${order.orderContent != null ? order.orderContent : '无具体说明'}"></span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="btn-row">
            <!-- 模拟支付宝支付成功：直接提交到后端更新支付状态 -->
            <form th:if="${paymentType == 'PRESCRIPTION'}"
                  th:action="@{/patient/prescriptions/{id}/pay(id=${businessId})}"
                  method="post">
                <button type="submit" class="btn btn-primary">支付</button>
            </form>

            <form th:if="${paymentType == 'HOSPITALIZATION'}"
                  th:action="@{/patient/hospitalizations/{id}/pay(id=${businessId})}"
                  method="post">
                <button type="submit" class="btn btn-primary">支付</button>
            </form>

            <form th:if="${paymentType == 'EXAM_REPORT'}"
                  th:action="@{/patient/reports/{id}/pay(id=${businessId})}"
                  method="post">
                <button type="submit" class="btn btn-primary">支付</button>
            </form>

            <button type="button"
                    class="btn btn-secondary"
                    th:data-cancel-url="${cancelUrl}">
                取消返回
            </button>
        </div>
    </div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var cancelBtn = document.querySelector('.btn.btn-secondary[data-cancel-url]');
        if (cancelBtn) {
            var url = cancelBtn.getAttribute('data-cancel-url');
            cancelBtn.addEventListener('click', function () {
                if (url) {
                    window.location.href = url;
                }
            });
        }
    });
</script>
</body>
</html>
