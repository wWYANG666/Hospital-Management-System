<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挂号信息管理</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
    <script>
        function toggleAllAppointments(source) {
            document.querySelectorAll('input[name="ids"]').forEach(function (cb) { cb.checked = source.checked; });
        }
        function confirmBulkDeleteAppointments() {
            var checked = document.querySelectorAll('input[name="ids"]:checked').length;
            if (checked === 0) {
                alert('请先勾选要删除的挂号记录');
                return false;
            }
            return confirm('确定要删除已勾选的 ' + checked + ' 条挂号记录吗？此操作不可恢复。');
        }
    </script>
</head>
<body class="theme-medical">
<div th:replace="~{admin/fragments :: topbarAdminSub('/admin/dashboard', '挂号信息管理', '预约记录维护')}"></div>

<main class="page">
    <div class="card">
        <form th:action="@{/admin/appointments/bulk-delete}" method="post" onsubmit="return confirmBulkDeleteAppointments()">
            <div class="admin-toolbar">
                <button class="btn-cancel u-pill-btn" type="submit">删除选中</button>
                <span class="u-text-xs-muted">勾选后可批量删除。</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th><input type="checkbox" onclick="toggleAllAppointments(this)"></th>
                        <th>ID</th>
                        <th>患者</th>
                        <th>医生</th>
                        <th>预约日期</th>
                        <th>预约时间</th>
                        <th>状态</th>
                        <th>症状</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${appointments}">
                        <td><input type="checkbox" name="ids" th:value="${a.id}"></td>
                        <td th:text="${a.id}"></td>
                        <td>
                            <a th:href="@{/admin/patients/{id}(id=${a.patientId})}"
                               th:text="${patientUserMap != null and patientUserMap.containsKey(a.patientId) ? patientUserMap[a.patientId].realName : a.patientId}"
                               class="u-link-primary-medium"></a>
                        </td>
                        <td th:text="${doctorUserMap != null and doctorUserMap.containsKey(a.doctorId) ? doctorUserMap[a.doctorId].realName : a.doctorId}"></td>
                        <td th:text="${a.appointmentDate}"></td>
                        <td th:text="${a.appointmentTime}"></td>
                        <td>
                            <form th:action="@{/admin/appointments/{id}/status(id=${a.id})}" method="post" class="u-inline">
                                <select name="status" onchange="this.form.submit()" class="u-select-chip">
                                    <option value="PENDING" th:selected="${a.status.name()=='PENDING'}">待确认</option>
                                    <option value="CONFIRMED" th:selected="${a.status.name()=='CONFIRMED'}">已确认</option>
                                    <option value="COMPLETED" th:selected="${a.status.name()=='COMPLETED'}">已完成</option>
                                    <option value="CANCELLED" th:selected="${a.status.name()=='CANCELLED'}">已取消</option>
                                </select>
                            </form>
                        </td>
                        <td th:text="${a.symptoms}"></td>
                        <td>
                            <a th:href="@{/admin/appointments/{id}/reports(id=${a.id})}" class="btn btn-primary u-chip-xs">报告单</a>
                            <a th:href="@{/admin/appointments/{id}/prescriptions(id=${a.id})}" class="btn btn-primary u-tag-success-chip">处方</a>
                            <form th:action="@{/admin/appointments/{id}/cancel(id=${a.id})}" method="post" class="u-inline">
                                <button class="btn ghost u-chip-xs" type="submit">取消</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </div>
</main>
</body>
</html>
