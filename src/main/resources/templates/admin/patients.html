<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者信息管理</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
</head>
<body class="theme-medical">
<div th:replace="~{admin/fragments :: topbarAdminSub('/admin/dashboard', '患者信息管理', '检索与查看患者')}"></div>

<main class="page">
    <section class="card">
        <h1 class="admin-hero-title">患者信息总览</h1>
        <p class="admin-hero-text">按身份证或姓名检索</p>
        <div class="admin-hero-stats">
            <div class="admin-hero-stat">
                <div class="lbl">结果数量</div>
                <div class="val" th:text="${patients != null ? patients.size() : 0}">0</div>
            </div>
            <div class="admin-hero-stat">
                <div class="lbl">已登记身份证</div>
                <div class="val" th:text="${patients != null ? patients.?[idCard != null and !idCard.isEmpty()].size() : 0}">0</div>
            </div>
            <div class="admin-hero-stat">
                <div class="lbl">可查看就诊</div>
                <div class="val" th:text="${patients != null ? patients.size() : 0}">0</div>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="admin-panel-head">
            <div>
                <div class="admin-panel-title">患者列表</div>
                <div class="admin-panel-sub">可进入患者详情</div>
            </div>
        </div>

        <div class="admin-toolbar">
            <form method="get" action="/admin/patients" class="u-flex-wrap-gap10-center">
                <input class="input" type="text" name="keyword" th:value="${keyword}" placeholder="身份证或姓名">
                <button class="btn btn-primary" type="submit">搜索</button>
                <a class="btn ghost" href="/admin/patients">清除</a>
            </form>
        </div>

        <div class="table-wrap" th:if="${patients != null and !patients.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>患者ID</th>
                    <th>患者编号</th>
                    <th>用户名</th>
                    <th>姓名</th>
                    <th>身份证</th>
                    <th>性别</th>
                    <th>电话</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${patients}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.patientCode}"></td>
                    <td th:text="${userMap.containsKey(p.id) ? userMap[p.id].username : ''}"></td>
                    <td th:text="${userMap.containsKey(p.id) ? userMap[p.id].realName : ''}"></td>
                    <td th:text="${p.idCard}"></td>
                    <td>
                        <span class="tag-inline tag-male" th:if="${p.gender != null and p.gender.name() == 'MALE'}">男</span>
                        <span class="tag-inline tag-female" th:if="${p.gender != null and p.gender.name() == 'FEMALE'}">女</span>
                        <span th:if="${p.gender == null}">-</span>
                    </td>
                    <td th:text="${userMap.containsKey(p.id) ? userMap[p.id].phone : ''}"></td>
                    <td>
                        <a class="btn btn-primary u-chip-xs-wide" th:href="@{/admin/patients/{id}(id=${p.id})}">查看挂号/就诊</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${patients == null or patients.isEmpty()}">暂无患者数据。</div>
    </section>
</main>
</body>
</html>
