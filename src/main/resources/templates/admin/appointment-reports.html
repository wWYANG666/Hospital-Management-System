<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者报告单</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
    <style>
        .info-section { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #EBEEF5; }
        .info-row { display: flex; margin: 6px 0; font-size: 13px; }
        .info-label { width: 100px; font-weight: 600; color: #606266; flex-shrink: 0; }
        .info-value { flex: 1; color: #303133; }
    </style>
</head>
<body class="theme-medical">
<div th:replace="~{admin/fragments :: topbarAdminSub('/admin/patients', '患者报告单', '报告明细查看')}"></div>

<main class="page">
    <div class="card">
        <h2 class="admin-panel-title u-mb-10">挂号信息</h2>
        <div class="info-section">
            <div class="info-row">
                <div class="info-label">患者</div>
                <div class="info-value" th:text="${patientUser != null ? patientUser.realName : '未知'}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">医生</div>
                <div class="info-value" th:text="${doctorUser != null ? doctorUser.realName : '未知'}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">预约日期</div>
                <div class="info-value" th:text="${appointment.appointmentDate}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">预约时间</div>
                <div class="info-value" th:text="${appointment.appointmentTime}"></div>
            </div>
            <div class="info-row">
                <div class="info-label">症状</div>
                <div class="info-value" th:text="${appointment.symptoms != null ? appointment.symptoms : '无'}"></div>
            </div>
        </div>

        <h2 class="admin-panel-title u-mt20">报告单列表</h2>
        <div th:if="${reports.isEmpty()}" class="empty u-p28">该挂号暂无报告单</div>
        <div class="table-wrap" th:if="${!reports.isEmpty()}">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>报告名称</th>
                    <th>生成时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reports}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${examinationMap.containsKey(r.id) ? examinationMap[r.id].name : r.reportType}"></td>
                    <td th:text="${r.reportDate != null ? #temporals.format(r.reportDate, 'yyyy-MM-dd HH:mm') : ''}"></td>
                    <td>
                        <span class="tag-inline" th:classappend="${r.status.name() == 'COMPLETED' ? ' tag-male' : ' tag-female'}"
                              th:text="${r.status.chineseName}"></span>
                    </td>
                    <td>
                        <a th:href="@{/admin/reports/{id}/preview(id=${r.id}, returnPatientId=${appointment.patientId})}" class="btn btn-primary u-chip-xs">查看</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="admin-toolbar u-toolbar-tight-16">
            <a href="/admin/dashboard" class="btn ghost">返回管理首页</a>
        </div>
    </div>
</main>
</body>
</html>
