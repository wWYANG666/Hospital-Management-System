<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 审计日志</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
</head>
<body class="theme-medical">
<div th:replace="~{admin/fragments :: topbarAdminSub('/admin/dashboard', 'AI 审计日志', 'AI 生成记录追溯')}"></div>

<main class="page">
    <div th:if="${success}" class="admin-msg-success" th:text="${success}"></div>
    <div th:if="${error}" class="admin-msg-error" th:text="${error}"></div>

    <div class="card">
        <div class="admin-panel-head ai-log-head">
            <div>
                <div class="admin-panel-title">审计检索</div>
                <div class="admin-panel-sub">支持按触发人、场景与时间范围组合筛选，便于追溯 AI 建议来源。</div>
            </div>
            <div class="ai-log-count-chip">
                当前命中 <strong th:text="${#lists.size(logs)}">0</strong> 条
            </div>
        </div>

        <form method="get" th:action="@{/admin/ai-logs}" class="ai-log-filter-grid">
            <label class="ai-log-field">
                <span>触发人</span>
                <select name="whoUser">
                    <option value="" th:selected="${whoUser == null or whoUser == ''}">全部触发人</option>
                    <option th:each="u : ${triggerUsers}"
                            th:value="${u}"
                            th:selected="${whoUser == u}"
                            th:text="${u}">
                        doctor:admin
                    </option>
                </select>
            </label>
            <label class="ai-log-field">
                <span>场景</span>
                <select name="whereScene">
                    <option value="" th:selected="${whereScene == null or whereScene == ''}">全部场景</option>
                    <option value="doctor.diagnosis" th:selected="${whereScene == 'doctor.diagnosis'}">医生端-诊断建议</option>
                    <option value="doctor.report" th:selected="${whereScene == 'doctor.report'}">医生端-报告草稿</option>
                    <option value="patient.triage" th:selected="${whereScene == 'patient.triage'}">患者端-导诊建议</option>
                    <option value="admin.summary" th:selected="${whereScene == 'admin.summary'}">管理端-运营摘要</option>
                </select>
            </label>
            <label class="ai-log-field">
                <span>开始时间</span>
                <input id="fromTimeInput" type="datetime-local" name="fromTime" th:value="${fromTime}">
            </label>
            <label class="ai-log-field">
                <span>结束时间</span>
                <input id="toTimeInput" type="datetime-local" name="toTime" th:value="${toTime}">
            </label>
            <label class="ai-log-field">
                <span>返回条数</span>
                <input type="number" name="limit" min="1" max="500" th:value="${limit}">
            </label>
            <div class="ai-log-actions">
                <button type="submit" class="btn btn-primary">查询日志</button>
                <a href="/admin/ai-logs" class="btn ghost">清空筛选</a>
            </div>
            <div class="ai-log-quick-range">
                <button type="button" class="btn ghost" onclick="setQuickRange(1)">最近1小时</button>
                <button type="button" class="btn ghost" onclick="setQuickRange(24)">最近24小时</button>
                <button type="button" class="btn ghost" onclick="setQuickRange(72)">最近3天</button>
                <button type="button" class="btn ghost" onclick="setTodayRange()">今天</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="admin-panel-head">
            <div>
                <div class="admin-panel-title">日志列表</div>
                <div class="admin-panel-sub">展示字段：触发人 / 场景 / 输入 / 输出 / 时间</div>
            </div>
            <div class="ai-log-actions">
                <button type="submit"
                        form="aiLogBulkDeleteForm"
                        class="btn btn-cancel"
                        onclick="return confirmBulkDeleteAiLogs()">
                    批量删除
                </button>
            </div>
        </div>
        <form id="aiLogBulkDeleteForm" method="post" th:action="@{/admin/ai-logs/bulk-delete}">
            <input type="hidden" name="whoUser" th:value="${whoUser}">
            <input type="hidden" name="whereScene" th:value="${whereScene}">
            <input type="hidden" name="fromTime" th:value="${fromTime}">
            <input type="hidden" name="toTime" th:value="${toTime}">
            <input type="hidden" name="limit" th:value="${limit}">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th><input type="checkbox" onclick="toggleAllAiLogs(this)"></th>
                        <th>ID</th>
                        <th>触发人</th>
                        <th>场景</th>
                        <th>输入</th>
                        <th>输出内容</th>
                        <th>时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="7" class="u-center-muted">暂无记录</td>
                    </tr>
                    <tr th:each="log : ${logs}">
                        <td><input type="checkbox" name="ids" th:value="${log.id}"></td>
                        <td th:text="${log.id}">1</td>
                        <td>
                            <div th:text="${log.whoUserZh}">医生（admin）</div>
                            <div class="u-text-xs-muted" th:text="${log.whoUser}">doctor:admin</div>
                        </td>
                        <td>
                            <span class="tag-inline tag-male" th:text="${log.whereSceneZh}">医生端-诊断建议</span>
                        </td>
                        <td class="ai-log-cell">
                            <div class="ai-log-text clamp" th:id="${'in_' + log.id}" th:text="${log.inputPayloadZh}"></div>
                            <button type="button"
                                    class="ai-log-toggle"
                                    th:attr="data-target=${'in_' + log.id}"
                                    onclick="toggleLogText(this)">
                                展开
                            </button>
                        </td>
                        <td class="ai-log-cell">
                            <div class="ai-log-text clamp" th:id="${'out_' + log.id}" th:text="${log.outputText}"></div>
                            <button type="button"
                                    class="ai-log-toggle"
                                    th:attr="data-target=${'out_' + log.id}"
                                    onclick="toggleLogText(this)">
                                展开
                            </button>
                        </td>
                        <td th:text="${log.createdAt != null ? #temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss') : ''}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </form>
    </div>
</main>
<script>
    function toggleAllAiLogs(source) {
        document.querySelectorAll('#aiLogBulkDeleteForm input[name="ids"]').forEach(function (cb) {
            cb.checked = source.checked;
        });
    }

    function confirmBulkDeleteAiLogs() {
        var checked = document.querySelectorAll('#aiLogBulkDeleteForm input[name="ids"]:checked').length;
        if (checked === 0) {
            alert('请先勾选要删除的日志');
            return false;
        }
        return confirm('确定要删除已勾选的 ' + checked + ' 条日志吗？此操作不可恢复。');
    }

    function formatLocalDateTime(date) {
        var yyyy = date.getFullYear();
        var mm = String(date.getMonth() + 1).padStart(2, '0');
        var dd = String(date.getDate()).padStart(2, '0');
        var hh = String(date.getHours()).padStart(2, '0');
        var min = String(date.getMinutes()).padStart(2, '0');
        return yyyy + '-' + mm + '-' + dd + 'T' + hh + ':' + min;
    }

    function setQuickRange(hours) {
        var now = new Date();
        var from = new Date(now.getTime() - hours * 60 * 60 * 1000);
        var fromInput = document.getElementById('fromTimeInput');
        var toInput = document.getElementById('toTimeInput');
        if (fromInput) fromInput.value = formatLocalDateTime(from);
        if (toInput) toInput.value = formatLocalDateTime(now);
    }

    function setTodayRange() {
        var now = new Date();
        var from = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        var fromInput = document.getElementById('fromTimeInput');
        var toInput = document.getElementById('toTimeInput');
        if (fromInput) fromInput.value = formatLocalDateTime(from);
        if (toInput) toInput.value = formatLocalDateTime(now);
    }

    function toggleLogText(btn) {
        var targetId = btn.getAttribute('data-target');
        if (!targetId) return;
        var block = document.getElementById(targetId);
        if (!block) return;
        var isClamped = block.classList.contains('clamp');
        if (isClamped) {
            block.classList.remove('clamp');
            btn.textContent = '收起';
        } else {
            block.classList.add('clamp');
            btn.textContent = '展开';
        }
    }
</script>
</body>
</html>
