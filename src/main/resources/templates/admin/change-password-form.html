<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
    <style>
        .pwd-card { max-width: 560px; margin-left: auto; margin-right: auto; }
        .user-info-box {
            background: #F5F7FA; border: 1px solid #EBEEF5; padding: 12px; border-radius: 8px;
            margin-bottom: 16px; font-size: 13px; line-height: 1.75; color: #606266;
        }
        .user-info-box strong { color: #303133; }
        .pwd-form label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        .pwd-form input {
            width: 100%; padding: 10px; border: 1px solid #DCDFE6; border-radius: 4px; font-size: 13px;
        }
        .pwd-form input:focus { border-color: #409EFF; outline: none; box-shadow: 0 0 0 2px rgba(64,158,255,.12); }
        .pwd-form .form-group { margin-bottom: 14px; }
    </style>
</head>
<body class="theme-medical">
<div th:replace="~{admin/fragments :: topbarAdminSub(${returnTo != null ? returnTo : (departmentId != null ? '/admin/departments/' + departmentId + '/edit' : '/admin/departments')}, '修改密码', '重置账号密码')}"></div>

<main class="page">
    <div class="card pwd-card pwd-form">
        <div class="admin-panel-title u-mb-6">密码重置</div>
        <p class="admin-panel-sub u-mb-14">输入新密码并提交</p>

        <div th:if="${error}" class="admin-msg-error"><span th:text="${error}">操作失败</span></div>

        <div class="user-info-box" th:if="${user}">
            <strong>用户信息</strong><br>
            姓名：<span th:text="${user.realName}"></span><br>
            用户名：<span th:text="${user.username}"></span>
        </div>

        <form th:action="@{/admin/users/{id}/change-password(id=${user.id}, departmentId=${departmentId})}" method="post">
            <input type="hidden" name="returnTo" th:if="${returnTo != null}" th:value="${returnTo}">
            <div class="form-group">
                <label>新密码 *</label>
                <input type="password" name="newPassword" required minlength="6" placeholder="至少 6 位">
            </div>
            <div class="form-group">
                <label>确认新密码 *</label>
                <input type="password" name="confirmPassword" required minlength="6" placeholder="再次输入">
            </div>
            <div class="admin-toolbar u-p0">
                <button type="submit" class="btn btn-primary" onclick="return validatePassword()">确认修改</button>
                <a th:href="${returnTo != null ? returnTo : (departmentId != null ? '/admin/departments/' + departmentId + '/edit' : '/admin/departments')}"
                   class="btn ghost">取消</a>
            </div>
        </form>
    </div>
</main>

<script>
    function validatePassword() {
        var newPassword = document.querySelector('input[name="newPassword"]').value;
        var confirmPassword = document.querySelector('input[name="confirmPassword"]').value;
        if (newPassword.length < 6) {
            alert('密码长度至少为 6 位');
            return false;
        }
        if (newPassword !== confirmPassword) {
            alert('两次输入的密码不一致，请重新输入');
            return false;
        }
        return confirm('确认修改该用户的密码吗？');
    }
</script>
</body>
</html>
