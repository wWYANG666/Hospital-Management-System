<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住院申请管理</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
</head>
<body class="theme-medical doctor-page-hospitalizations">
    <div th:replace="~{doctor/fragments :: topbarSub('/doctor/dashboard', '住院申请管理', '审核申请与分配床位')}"></div>

    <div class="page">
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}">操作成功</span>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}">操作失败</span>
        </div>

        <div class="card">
            <div class="card-title">
                <span>出院申请待处理</span>
                <span class="u-text-xs-muted">
                    共 <span th:text="${dischargeRequestHospitalizations != null ? #lists.size(dischargeRequestHospitalizations) : 0}">0</span> 条
                </span>
            </div>
            <div class="card-sub">当前住院患者</div>

            <div th:if="${dischargeRequestHospitalizations == null or dischargeRequestHospitalizations.isEmpty()}" class="empty">
                暂无出院申请待处理
            </div>

            <div class="table-wrap" th:if="${dischargeRequestHospitalizations != null and !dischargeRequestHospitalizations.isEmpty()}">
                <table>
                    <thead>
                    <tr>
                        <th>患者</th>
                        <th>入院日期</th>
                        <th>床位号</th>
                        <th>标记</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="hosp : ${dischargeRequestHospitalizations}">
                        <td th:text="${userMap.containsKey(hosp.patientId) ? userMap[hosp.patientId].realName : hosp.patientId}"></td>
                        <td th:text="${hosp.admissionDate}"></td>
                        <td th:text="${hosp.bedId != null and bedMap.containsKey(hosp.bedId) ? bedMap[hosp.bedId].bedNumber : '未分配'}"></td>
                        <td><span class="doctor-hosp-tag doctor-hosp-tag--discharge-req">申请出院</span></td>
                        <td>
                            <div class="table-actions doctor-hosp-actions">
                                <a th:href="@{/doctor/hospitalizations/{id}/manage(id=${hosp.id})}"
                                   class="btn btn-view">管理</a>
                                <a th:href="@{/doctor/hospitalizations/{id}/discharge(id=${hosp.id})}"
                                   class="btn doctor-hosp-btn doctor-hosp-btn--discharge">办理出院</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>住院申请列表</span>
                <span class="u-text-xs-muted">
                    共 <span th:text="${#lists.size(hospitalizations)}">0</span> 条
                </span>
            </div>
            <div class="card-sub">历史住院记录</div>

            <div th:if="${hospitalizations.isEmpty()}" class="empty">
                暂无住院申请记录
            </div>

            <div class="table-wrap" th:if="${!hospitalizations.isEmpty()}">
                <table>
                    <thead>
                    <tr>
                        <th>患者</th>
                        <th>申请时间</th>
                        <th>入院日期</th>
                        <th>床位号</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="hosp : ${hospitalizations}">
                        <td th:text="${userMap.containsKey(hosp.patientId) ? userMap[hosp.patientId].realName : hosp.patientId}"></td>
                        <td th:text="${hosp.createdAt != null ? #temporals.format(hosp.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
                        <td th:text="${hosp.admissionDate}"></td>
                        <td th:text="${hosp.bedId != null and bedMap.containsKey(hosp.bedId) ? bedMap[hosp.bedId].bedNumber : '未分配'}"></td>
                        <td>
                            <div class="doctor-hosp-status-cell">
                                <span th:if="${hosp.bedId == null}" class="doctor-hosp-tag doctor-hosp-tag--pending">待分配床位</span>
                                <span th:if="${hosp.bedId != null}" class="doctor-hosp-tag doctor-hosp-tag--assigned">已分配床位</span>
                                <span th:if="${hosp.status != null and hosp.status.name() == 'ADMITTED'}" class="doctor-hosp-tag doctor-hosp-tag--admitted" th:text="${hosp.status.chineseName}">住院中</span>
                                <span th:if="${hosp.status != null and hosp.status.name() == 'DISCHARGED'}" class="doctor-hosp-tag doctor-hosp-tag--discharged" th:text="${hosp.status.chineseName}">已出院</span>
                                <span th:if="${hosp.status == null and hosp.requestStatus != null}" class="doctor-hosp-tag doctor-hosp-tag--pending" th:text="${hosp.requestStatus.chineseName}">待审批</span>
                                <span th:if="${dischargeRequestHospIds != null and dischargeRequestHospIds.contains(hosp.id)}"
                                      class="doctor-hosp-tag doctor-hosp-tag--discharge-req">申请出院</span>
                            </div>
                        </td>
                        <td>
                            <div class="table-actions doctor-hosp-actions">
                                <a th:if="${hosp.bedId == null}"
                                   th:href="@{/doctor/hospitalizations/{id}/assign-bed(id=${hosp.id})}"
                                   class="btn btn-edit">分配床位</a>
                                <a th:if="${hosp.bedId != null and (hosp.status == null or hosp.status.name() == 'ADMITTED')}"
                                   th:href="@{/doctor/hospitalizations/{id}/manage(id=${hosp.id})}"
                                   class="btn btn-view">管理</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
