<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号未绑定医生档案</title>
    <link rel="stylesheet" href="/css/doctor-shell.css">
    <style>
        .unbound-page { max-width: 520px; margin: 48px auto; padding: 24px; }
        .unbound-card {
            background: #fff;
            border-radius: 12px;
            padding: 28px 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .unbound-card h1 { font-size: 18px; margin-bottom: 12px; color: #303133; }
        .unbound-card p { font-size: 14px; color: #606266; line-height: 1.7; margin-bottom: 20px; }
        .unbound-actions a {
            display: inline-block;
            margin-right: 12px;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-home { background: #409EFF; color: #fff; }
        .btn-logout { background: #F56C6C; color: #fff; }
    </style>
</head>
<body class="theme-medical">
<div class="unbound-page">
    <div class="unbound-card">
        <h1>无法进入医生工作台</h1>
        <p>
            当前账号已具备医生角色，但系统中<strong>没有关联的医生档案</strong>（或数据不完整）。
            请使用管理员账号在「科室 / 医生管理」中为您创建并审核医生档案，或联系系统管理员处理。
        </p>
        <div class="unbound-actions">
            <a class="btn-home" href="/">返回首页</a>
            <a class="btn-logout" href="/logout">退出登录</a>
        </div>
    </div>
</div>
</body>
</html>
