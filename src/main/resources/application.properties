spring.application.name=YIYUAN
spring.config.import=optional:file:./config/application-local.properties

# 默认端口（可以通过命令行参数覆盖）
server.port=8082
hospital.portal.mode=patient
hospital.bootstrap.enabled=false

# 保证 HTML/Thymeleaf 页面以 UTF-8 输出，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 数据库配置
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yiyuan?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL is managed explicitly through database/init.sql and staff bootstrap migrations.
spring.sql.init.mode=never

# Session 配置 - 根据端口动态设置 Cookie 名称，避免多实例冲突
# 注意：如果使用多个实例，每个实例的 Cookie 名称应该不同
# application-patient.properties / application-staff.properties define each portal.
server.servlet.session.cookie.name=PATIENT_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Keep internal exception details out of public error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# AI（阿里通义千问）配置：导诊助手优先调用 qwen-plus，失败时回退本地规则
ai.qwen.enabled=${AI_QWEN_ENABLED:false}
ai.qwen.model=qwen-plus
ai.qwen.endpoint=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
ai.qwen.timeout-seconds=8
# 建议通过环境变量注入，避免明文写在仓库
ai.qwen.api-key=${DASHSCOPE_API_KEY:}

# Optional staff bootstrap credentials. Leave empty to disable automatic admin creation.
hospital.admin.username=${HOSPITAL_ADMIN_USERNAME:admin}
hospital.admin.password=${HOSPITAL_ADMIN_PASSWORD:}
